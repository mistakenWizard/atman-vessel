[package]
name = "orch"
version = "1.7.0"
edition = "2024"

[[bin]]
name = "orch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
libc = "0.2.185"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_with = "3.18.0"
uuid = { version = "1.23.0", features = ["v4"] }
tokio = { version = "1.43.0", features = ["full"] }
futures = "0.3.31"
